[package]
name = "tachyond"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tachyond — the persistent Tachyon daemon (Phase 2)"

[[bin]]
name = "tachyond"
path = "src/main.rs"

[dependencies]
tachyon-interaction-manager = { path = "../interaction/manager" }
tempfile.workspace = true
redb.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tachyon-api.workspace = true
tachyon-orchestrator.workspace = true
tachyon-util.workspace = true
tachyon-model.workspace = true
tokio.workspace = true
signal-hook.workspace = true
nix = { workspace = true, features = ["socket"] }
rustix = { version = "1", features = ["fs"] }
sha2.workspace = true
url = "2"
tachyon-memory = { path = "../memory" }
ghost = { path = "../ghost" }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
