[package]
name = "tachyon-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Markdown-first durable memory service for Tachyon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tachyon-memory"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml.workspace = true
dirs = "6"
