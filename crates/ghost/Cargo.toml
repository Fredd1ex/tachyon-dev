[package]
name = "ghost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ghost — the Tachyon agent harness"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls", "blocking"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
thiserror.workspace = true
tachyon-util.workspace = true
tachyon-api.workspace = true
tachyon-orchestrator.workspace = true
tachyon-model.workspace = true
shell-words.workspace = true
fs2.workspace = true
ignore.workspace = true
globset.workspace = true
regex.workspace = true
nix = { workspace = true, features = ["fs"] }
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
